<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBアプリ ランチャー</title>

    <link rel="apple-touch-icon" href="https://takupocho.github.io/app/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ランチャー">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #e6edf3;
            --accent-color: #2f81f7;
            --accent-hover: #388bfd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(47, 129, 247, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 148, 158, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px 22px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .settings-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: grayscale(100%) brightness(200%);
        }

        .settings-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: rotate(30deg);
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-shadow: 0 2px 8px rgba(47, 129, 247, 0.4);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(47, 129, 247, 0.6);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background-color: #da3633;
            color: white;
            box-shadow: none;
            border: none;
        }

        .btn-danger:hover {
            background-color: #f85149;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 600px;
            padding: 10px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-item:hover {
            transform: translateY(-4px);
        }

        .app-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            margin-bottom: 8px;
            padding: 4px;
            transition: all 0.2s;
        }

        .app-item:hover .app-icon {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(47, 129, 247, 0.4);
        }

        .app-item:active .app-icon {
            transform: scale(0.95);
        }

        .app-name {
            font-size: 0.75rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
            font-weight: 500;
            color: #8b949e;
        }

        .app-item:hover .app-name {
            color: var(--text-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(1, 4, 9, 0.8);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid var(--border-color);
            padding: 28px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 1.15rem;
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .settings-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .edit-app-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }

        .edit-app-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .edit-app-thumb {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }

        .edit-app-title {
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-small {
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #8b949e;
        }

        .form-group input[type="text"],
        .form-group input[type="url"] {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.3);
        }

        .form-text {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 6px;
            margin-bottom: 0;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        #importFile {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-area">
            <h1>My App Launcher</h1>
            <button class="settings-btn" onclick="openSettingsModal()" title="設定">⚙️</button>
        </div>
    </header>

    <div class="app-grid" id="appGrid"></div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>SYSTEM SETTINGS</h2>
            <div class="settings-menu">
                <button class="btn" onclick="openAddModal()">+ アプリ追加</button>
                <button class="btn btn-secondary" onclick="openEditListModal()">アプリの編集・削除</button>
                <button class="btn btn-secondary" onclick="exportData()">データをエクスポート</button>
                <button class="btn btn-secondary" onclick="triggerImport()">データをインポート</button>
            </div>
            <div style="text-align: right;">
                <button class="btn btn-secondary" onclick="closeSettingsModal()">閉じる</button>
            </div>
        </div>
    </div>

    <input type="file" id="importFile" accept=".json" onchange="importData(event)">

    <div class="modal" id="appModal">
        <div class="modal-content">
            <h2 id="modalTitle">アプリを追加</h2>
            <form id="appForm" onsubmit="saveApp(event)">
                <input type="hidden" id="editIndex" value="">
                <div class="form-group">
                    <label>アプリ名</label>
                    <input type="text" id="appName" required placeholder="例: Dashboard">
                </div>
                <div class="form-group">
                    <label>起動URL</label>
                    <input type="url" id="appUrl" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>画像ファイル名 / パス</label>
                    <input type="text" id="appImage" required placeholder="例: icon.png">
                    <p class="form-text">※ HTMLと同じ階層にある場合はファイル名を入力</p>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAppModal()">キャンセル</button>
                    <button type="submit" class="btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="editListModal">
        <div class="modal-content">
            <h2>EDIT APPLICATIONS</h2>
            <div id="editAppListContainer" style="margin-bottom: 20px;"></div>
            <div style="text-align: right;">
                <button class="btn btn-secondary" onclick="closeEditListModal()">戻る</button>
            </div>
        </div>
    </div>

    <script>
        let apps = [];
        const appGrid = document.getElementById('appGrid');
        const settingsModal = document.getElementById('settingsModal');
        const appModal = document.getElementById('appModal');
        const editListModal = document.getElementById('editListModal');

        function renderApps() {
            appGrid.innerHTML = '';
            apps.forEach((app, index) => {
                const item = document.createElement('div');
                item.className = 'app-item';
                item.innerHTML = `
                    <a href="${app.url}" target="_blank" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; width: 100%;">
                        <img src="${app.image}" class="app-icon" alt="${app.name}" onerror="this.src='https://via.placeholder.com/64?text=NoImage'">
                        <span class="app-name">${app.name}</span>
                    </a>
                `;
                appGrid.appendChild(item);
            });
        }

        async function initApp() {
            try {
                const response = await fetch('app_launcher_data.json');
                if (response.ok) {
                    apps = await response.json();
                    localStorage.setItem('web_apps', JSON.stringify(apps));
                } else {
                    throw new Error('JSON not found');
                }
            } catch (error) {
                apps = JSON.parse(localStorage.getItem('web_apps')) || [];
            }
            renderApps();
        }

        function openSettingsModal() { settingsModal.style.display = 'flex'; }
        function closeSettingsModal() { settingsModal.style.display = 'none'; }

        function openAddModal() {
            closeSettingsModal();
            document.getElementById('modalTitle').innerText = 'アプリを追加';
            document.getElementById('appForm').reset();
            document.getElementById('editIndex').value = '';
            appModal.style.display = 'flex';
        }

        function openEditModal(index) {
            closeEditListModal();
            const app = apps[index];
            document.getElementById('modalTitle').innerText = 'アプリを編集';
            document.getElementById('appName').value = app.name;
            document.getElementById('appUrl').value = app.url;
            document.getElementById('appImage').value = app.image;
            document.getElementById('editIndex').value = index;
            appModal.style.display = 'flex';
        }

        function closeAppModal() { appModal.style.display = 'none'; document.getElementById('appForm').reset(); }

        function saveApp(event) {
            event.preventDefault();
            const name = document.getElementById('appName').value;
            const url = document.getElementById('appUrl').value;
            const image = document.getElementById('appImage').value.trim();
            const editIndex = document.getElementById('editIndex').value;

            if (editIndex === "") {
                apps.push({ name, url, image });
            } else {
                apps[editIndex] = { name, url, image };
            }

            localStorage.setItem('web_apps', JSON.stringify(apps));
            renderApps();
            closeAppModal();
        }

        function openEditListModal() {
            closeSettingsModal();
            const container = document.getElementById('editAppListContainer');
            container.innerHTML = '';

            if (apps.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#8b949e; font-size:0.9rem;">登録されているアプリはありません。</p>';
            } else {
                apps.forEach((app, index) => {
                    const row = document.createElement('div');
                    row.className = 'edit-app-row';
                    row.innerHTML = `
                        <div class="edit-app-info">
                            <img src="${app.image}" class="edit-app-thumb" onerror="this.src='https://via.placeholder.com/32?text=?'">
                            <span class="edit-app-title">${app.name}</span>
                        </div>
                        <div class="edit-actions">
                            <button class="btn btn-secondary btn-small" onclick="openEditModal(${index})">編集</button>
                            <button class="btn btn-danger btn-small" onclick="deleteApp(${index})">削除</button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            }
            editListModal.style.display = 'flex';
        }

        function closeEditListModal() { editListModal.style.display = 'none'; }

        function deleteApp(index) {
            if (confirm(`「${apps[index].name}」を削除しますか？`)) {
                apps.splice(index, 1);
                localStorage.setItem('web_apps', JSON.stringify(apps));
                renderApps();
                openEditListModal();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apps, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "app_launcher_data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() { document.getElementById('importFile').click(); }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedApps = JSON.parse(e.target.result);
                    if (Array.isArray(importedApps)) {
                        if (confirm('現在の登録内容に上書きしますか？\n「OK」で上書きします。')) {
                            apps = importedApps;
                            localStorage.setItem('web_apps', JSON.stringify(apps));
                            renderApps();
                            alert('インポートが完了しました！');
                            closeSettingsModal();
                        }
                    } else {
                        alert('ファイル形式が正しくありません。');
                    }
                } catch (err) {
                    alert('JSONファイルの読み込みに失敗しました。');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        initApp();
    </script>
</body>
</html>
