<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBアプリ ランチャー</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 122, 255, 0.3);
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #e4e6eb;
            color: #4b4f56;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #d8dadf;
        }

        /* アプリグリッド（スマホのホーム画面風） */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
            padding: 10px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            position: relative;
            cursor: pointer;
        }

        .app-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            margin-bottom: 6px;
            transition: transform 0.1s;
        }

        .app-item:active .app-icon {
            transform: scale(0.95);
        }

        .app-name {
            font-size: 0.75rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        /* 削除ボタン */
        .delete-btn {
            position: absolute;
            top: -5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .app-item:hover .delete-btn {
            display: flex;
        }

        /* モーダルウィンドウ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input[type="text"],
        .form-group input[type="url"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .form-text {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
            margin-bottom: 0;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        #importFile {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>My App Launcher</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="exportData()">エクスポート</button>
            <button class="btn btn-secondary" onclick="triggerImport()">インポート</button>
            <input type="file" id="importFile" accept=".json" onchange="importData(event)">
            <button class="btn" onclick="openModal()">+ アプリ追加</button>
        </div>
    </header>

    <!-- アプリ一覧が表示されるグリッド -->
    <div class="app-grid" id="appGrid"></div>

    <!-- アプリ追加モーダル -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>アプリを追加</h2>
            <form id="appForm" onsubmit="saveApp(event)">
                <div class="form-group">
                    <label>アプリ名</label>
                    <input type="text" id="appName" required placeholder="例: Todoアプリ">
                </div>
                <div class="form-group">
                    <label>起動URL</label>
                    <input type="url" id="appUrl" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>画像ファイル名 / パス</label>
                    <input type="text" id="appImage" required placeholder="例: icon.png や https://...">
                    <p class="form-text">※ HTMLと同じ階層にある場合はファイル名（例: <code>app.png</code>）を入力</p>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">キャンセル</button>
                    <button type="submit" class="btn" style="background-color: #007aff; color: white;">登録</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let apps = [];
        const appGrid = document.getElementById('appGrid');
        const addModal = document.getElementById('addModal');

        // 画面描画
        function renderApps() {
            appGrid.innerHTML = '';
            apps.forEach((app, index) => {
                const item = document.createElement('div');
                item.className = 'app-item';
                
                item.innerHTML = `
                    <a href="${app.url}" target="_blank" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; width: 100%;">
                        <img src="${app.image}" class="app-icon" alt="${app.name}" onerror="this.src='https://via.placeholder.com/64?text=NoImage'">
                        <span class="app-name">${app.name}</span>
                    </a>
                    <button class="delete-btn" onclick="deleteApp(event, ${index})">×</button>
                `;
                appGrid.appendChild(item);
            });
        }

        // 初期化処理（起動時に同一階層の app_launcher_data.json を読み込む）
        async function initApp() {
            try {
                const response = await fetch('app_launcher_data.json');
                if (response.ok) {
                    apps = await response.json();
                    // 読み込んだ内容をLocalStorageにも同期しておく
                    localStorage.setItem('web_apps', JSON.stringify(apps));
                } else {
                    throw new Error('JSON not found');
                }
            } catch (error) {
                // ファイルが存在しない、または何らかのエラーの場合はLocalStorageからフォールバック読み込み
                apps = JSON.parse(localStorage.getItem('web_apps')) || [];
            }
            renderApps();
        }

        // モーダルを開く
        function openModal() {
            addModal.style.display = 'flex';
        }

        // モーダルを閉じる
        function closeModal() {
            addModal.style.display = 'none';
            document.getElementById('appForm').reset();
        }

        // アプリの保存処理
        function saveApp(event) {
            event.preventDefault();
            
            const name = document.getElementById('appName').value;
            const url = document.getElementById('appUrl').value;
            const image = document.getElementById('appImage').value.trim();

            apps.push({
                name: name,
                url: url,
                image: image
            });

            localStorage.setItem('web_apps', JSON.stringify(apps));
            renderApps();
            closeModal();
        }

        // アプリの削除
        function deleteApp(event, index) {
            event.stopPropagation();
            if (confirm('このアプリを削除しますか？')) {
                apps.splice(index, 1);
                localStorage.setItem('web_apps', JSON.stringify(apps));
                renderApps();
            }
        }

        // データの書き出し（エクスポート）
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apps, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "app_launcher_data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // インポート用ファイル選択を開く
        function triggerImport() {
            document.getElementById('importFile').click();
        }

        // データの読み込み（インポート）
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedApps = JSON.parse(e.target.result);
                    if (Array.isArray(importedApps)) {
                        if (confirm('現在の登録内容に上書きしますか？\n「OK」で上書きします。')) {
                            apps = importedApps;
                            localStorage.setItem('web_apps', JSON.stringify(apps));
                            renderApps();
                            alert('インポートが完了しました！');
                        }
                    } else {
                        alert('ファイル形式が正しくありません。');
                    }
                } catch (err) {
                    alert('JSONファイルの読み込みに失敗しました。');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // 起動実行
        initApp();
    </script>
</body>
</html>
