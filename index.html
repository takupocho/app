<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBアプリ ランチャー</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        /* 歯車ボタン */
        .settings-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 122, 255, 0.3);
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #e4e6eb;
            color: #4b4f56;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #d8dadf;
        }

        .btn-danger {
            background-color: #ff3b30;
            color: white;
            box-shadow: none;
        }

        .btn-danger:hover {
            background-color: #d32f2f;
        }

        /* アプリグリッド（スマホのホーム画面風） */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
            padding: 10px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            position: relative;
            cursor: pointer;
        }

        .app-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            margin-bottom: 6px;
            transition: transform 0.1s;
        }

        .app-item:active .app-icon {
            transform: scale(0.95);
        }

        .app-name {
            font-size: 0.75rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        /* モーダル共通 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 16px;
        }

        /* 設定メニューのリスト */
        .settings-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* 編集モーダル内のアプリ一覧行 */
        .edit-app-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }

        .edit-app-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .edit-app-thumb {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .edit-app-title {
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input[type="text"],
        .form-group input[type="url"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .form-text {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
            margin-bottom: 0;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        #importFile {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-area">
            <h1>My App Launcher</h1>
            <button class="settings-btn" onclick="openSettingsModal()" title="設定">⚙️</button>
        </div>
    </header>

    <!-- アプリ一覧が表示されるグリッド -->
    <div class="app-grid" id="appGrid"></div>

    <!-- 設定モーダル（メニュー） -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>設定・管理</h2>
            <div class="settings-menu">
                <button class="btn" onclick="openAddModal()">+ アプリ追加</button>
                <button class="btn btn-secondary" onclick="openEditListModal()">アプリの編集・削除</button>
                <button class="btn btn-secondary" onclick="exportData()">データをエクスポート</button>
                <button class="btn btn-secondary" onclick="triggerImport()">データをインポート</button>
            </div>
            <div style="text-align: right;">
                <button class="btn btn-secondary" onclick="closeSettingsModal()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- インポート用の隠しファイルinput -->
    <input type="file" id="importFile" accept=".json" onchange="importData(event)">

    <!-- アプリ追加 / 編集 共通モーダル -->
    <div class="modal" id="appModal">
        <div class="modal-content">
            <h2 id="modalTitle">アプリを追加</h2>
            <form id="appForm" onsubmit="saveApp(event)">
                <input type="hidden" id="editIndex" value="">
                <div class="form-group">
                    <label>アプリ名</label>
                    <input type="text" id="appName" required placeholder="例: Todoアプリ">
                </div>
                <div class="form-group">
                    <label>起動URL</label>
                    <input type="url" id="appUrl" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>画像ファイル名 / パス</label>
                    <input type="text" id="appImage" required placeholder="例: icon.png や https://...">
                    <p class="form-text">※ HTMLと同じ階層にある場合はファイル名（例: <code>app.png</code>）を入力</p>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAppModal()">キャンセル</button>
                    <button type="submit" class="btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 編集・削除用のアプリ一覧モーダル -->
    <div class="modal" id="editListModal">
        <div class="modal-content">
            <h2>アプリの編集・削除</h2>
            <div id="editAppListContainer" style="margin-bottom: 20px;">
                <!-- JavaScriptで動的にリスト生成 -->
            </div>
            <div style="text-align: right;">
                <button class="btn btn-secondary" onclick="closeEditListModal()">戻る</button>
            </div>
        </div>
    </div>

    <script>
        let apps = [];
        const appGrid = document.getElementById('appGrid');
        
        const settingsModal = document.getElementById('settingsModal');
        const appModal = document.getElementById('appModal');
        const editListModal = document.getElementById('editListModal');

        // 画面描画
        function renderApps() {
            appGrid.innerHTML = '';
            apps.forEach((app, index) => {
                const item = document.createElement('div');
                item.className = 'app-item';
                
                item.innerHTML = `
                    <a href="${app.url}" target="_blank" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; width: 100%;">
                        <img src="${app.image}" class="app-icon" alt="${app.name}" onerror="this.src='https://via.placeholder.com/64?text=NoImage'">
                        <span class="app-name">${app.name}</span>
                    </a>
                `;
                appGrid.appendChild(item);
            });
        }

        // 初期化処理（起動時に同一階層の app_launcher_data.json を読み込む）
        async function initApp() {
            try {
                const response = await fetch('app_launcher_data.json');
                if (response.ok) {
                    apps = await response.json();
                    localStorage.setItem('web_apps', JSON.stringify(apps));
                } else {
                    throw new Error('JSON not found');
                }
            } catch (error) {
                apps = JSON.parse(localStorage.getItem('web_apps')) || [];
            }
            renderApps();
        }

        // --- 設定メニューモーダル ---
        function openSettingsModal() {
            settingsModal.style.display = 'flex';
        }
        function closeSettingsModal() {
            settingsModal.style.display = 'none';
        }

        // --- アプリ追加・編集モーダル ---
        function openAddModal() {
            closeSettingsModal();
            document.getElementById('modalTitle').innerText = 'アプリを追加';
            document.getElementById('appForm').reset();
            document.getElementById('editIndex').value = '';
            appModal.style.display = 'flex';
        }

        function openEditModal(index) {
            closeEditListModal();
            const app = apps[index];
            document.getElementById('modalTitle').innerText = 'アプリを編集';
            document.getElementById('appName').value = app.name;
            document.getElementById('appUrl').value = app.url;
            document.getElementById('appImage').value = app.image;
            document.getElementById('editIndex').value = index;
            appModal.style.display = 'flex';
        }

        function closeAppModal() {
            appModal.style.display = 'none';
            document.getElementById('appForm').reset();
        }

        // アプリ保存（追加・更新兼務）
        function saveApp(event) {
            event.preventDefault();
            
            const name = document.getElementById('appName').value;
            const url = document.getElementById('appUrl').value;
            const image = document.getElementById('appImage').value.trim();
            const editIndex = document.getElementById('editIndex').value;

            if (editIndex === "") {
                // 追加
                apps.push({ name, url, image });
            } else {
                // 更新
                apps[editIndex] = { name, url, image };
            }

            localStorage.setItem('web_apps', JSON.stringify(apps));
            renderApps();
            closeAppModal();
        }

        // --- 編集・削除一覧モーダル ---
        function openEditListModal() {
            closeSettingsModal();
            const container = document.getElementById('editAppListContainer');
            container.innerHTML = '';

            if (apps.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#666; font-size:0.9rem;">登録されているアプリはありません。</p>';
            } else {
                apps.forEach((app, index) => {
                    const row = document.createElement('div');
                    row.className = 'edit-app-row';
                    row.innerHTML = `
                        <div class="edit-app-info">
                            <img src="${app.image}" class="edit-app-thumb" onerror="this.src='https://via.placeholder.com/32?text=?'">
                            <span class="edit-app-title">${app.name}</span>
                        </div>
                        <div class="edit-actions">
                            <button class="btn btn-secondary btn-small" onclick="openEditModal(${index})">編集</button>
                            <button class="btn btn-danger btn-small" onclick="deleteApp(${index})">削除</button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            }
            editListModal.style.display = 'flex';
        }

        function closeEditListModal() {
            editListModal.style.display = 'none';
        }

        // アプリ削除
        function deleteApp(index) {
            if (confirm(`「${apps[index].name}」を削除しますか？`)) {
                apps.splice(index, 1);
                localStorage.setItem('web_apps', JSON.stringify(apps));
                renderApps();
                openEditListModal(); // リストを再描画
            }
        }

        // --- エクスポート・インポート ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apps, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "app_launcher_data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedApps = JSON.parse(e.target.result);
                    if (Array.isArray(importedApps)) {
                        if (confirm('現在の登録内容に上書きしますか？\n「OK」で上書きします。')) {
                            apps = importedApps;
                            localStorage.setItem('web_apps', JSON.stringify(apps));
                            renderApps();
                            alert('インポートが完了しました！');
                            closeSettingsModal();
                        }
                    } else {
                        alert('ファイル形式が正しくありません。');
                    }
                } catch (err) {
                    alert('JSONファイルの読み込みに失敗しました。');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // 起動実行
        initApp();
    </script>
</body>
</html>
